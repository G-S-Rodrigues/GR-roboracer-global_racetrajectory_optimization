name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: "Run check.sh --full (includes the heavy Spielberg solves)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    name: check.sh --ready
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: docker/setup-buildx-action@v3

      - name: Build the dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          tags: gr-tum:dev
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: check.sh
        run: |
          mode=--ready
          if [ "${{ inputs.full }}" = "true" ]; then mode=--full; fi
          docker run --rm --volume "$PWD:/ws" --workdir /ws gr-tum:dev \
            ./scripts/check.sh "$mode"
